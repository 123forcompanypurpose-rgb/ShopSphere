<rect x="330.0" y="290.0" width="460.0" height="44.0" rx="22" fill="#dcece8" stroke="#6fa89e" stroke-width="1.1"/>
<text x="560.0" y="312.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#2b2b28" text-anchor="middle" font-weight="normal" dominant-baseline="central">Log in and log out</text>
<rect x="330.0" y="342.0" width="460.0" height="44.0" rx="22" fill="#dcece8" stroke="#6fa89e" stroke-width="1.1"/>
