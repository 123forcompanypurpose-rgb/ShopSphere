<svg xmlns="http://www.w3.org/2000/svg" width="900" height="910" viewBox="0 0 900 910" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
<title>ShopSphere use case diagram</title>
<desc>Guest browses and registers; Customer transacts; Administrator manages catalogue and orders. Customer generalises Guest.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M1 1L9 5L1 9" fill="none" stroke="#8a8880" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/>
</marker>
<marker id="openarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M1 1L9 5L1 9" fill="none" stroke="#8a8880" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/>
</marker>
<marker id="tri" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
  <path d="M1.5 1.5L14.5 8L1.5 14.5Z" fill="#ffffff" stroke="#8a8880" stroke-width="1.3" stroke-linejoin="round" stroke-dasharray="none"/>
</marker>
<marker id="diamond" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="12" markerHeight="10" orient="auto-start-reverse">
  <path d="M1 5L7 1L13 5L7 9Z" fill="#ffffff" stroke="#8a8880" stroke-width="1.3" stroke-linejoin="round"/>
</marker>
</defs>
