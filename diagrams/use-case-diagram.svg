<text x="125.0" y="184.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#2b2b28" text-anchor="middle" font-weight="600" dominant-baseline="central">Guest</text>
<rect x="40.0" y="444.0" width="170.0" height="48.0" rx="8" fill="#fbe6dc" stroke="#d99a7c" stroke-width="1.1"/>
<text x="125.0" y="468.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#2b2b28" text-anchor="middle" font-weight="600" dominant-baseline="central">Customer</text>
