<text x="40.0" y="57.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#6f6e68" text-anchor="start" font-weight="normal" dominant-baseline="central">Thirteen goals, not thirty endpoints. A use case is what a user wants to achieve.</text>
<rect x="300.0" y="80.0" width="530.0" height="770.0" rx="18" fill="#ffffff" stroke="#b5b3aa" stroke-width="1.1"/>
