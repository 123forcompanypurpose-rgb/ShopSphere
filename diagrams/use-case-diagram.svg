<rect x="330.0" y="394.0" width="460.0" height="44.0" rx="22" fill="#dcece8" stroke="#6fa89e" stroke-width="1.1"/>
<text x="560.0" y="416.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#2b2b28" text-anchor="middle" font-weight="normal" dominant-baseline="central">Manage shopping cart</text>
<rect x="330.0" y="446.0" width="460.0" height="44.0" rx="22" fill="#dcece8" stroke="#6fa89e" stroke-width="1.1"/>
<text x="560.0" y="468.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#2b2b28" text-anchor="middle" font-weight="normal" dominant-baseline="central">Manage wishlist</text>
<rect x="330.0" y="498.0" width="460.0" height="44.0" rx="22" fill="#dcece8" stroke="#6fa89e" stroke-width="1.1"/>
<text x="560.0" y="520.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#2b2b28" text-anchor="middle" font-weight="normal" dominant-baseline="central">Place an order and pay</text>
<rect x="330.0" y="550.0" width="460.0" height="44.0" rx="22" fill="#dcece8" stroke="#6fa89e" stroke-width="1.1"/>
<text x="560.0" y="572.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#2b2b28" text-anchor="middle" font-weight="normal" dominant-baseline="central">Track orders and view order history</text>
<rect x="330.0" y="602.0" width="460.0" height="44.0" rx="22" fill="#dcece8" stroke="#6fa89e" stroke-width="1.1"/>
<text x="560.0" y="624.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#2b2b28" text-anchor="middle" font-weight="normal" dominant-baseline="central">Write a product review</text>
<rect x="330.0" y="680.0" width="460.0" height="44.0" rx="22" fill="#e6e1f2" stroke="#9b8cc4" stroke-width="1.1"/>
<text x="560.0" y="702.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#2b2b28" text-anchor="middle" font-weight="normal" dominant-baseline="central">Manage products and categories</text>
<rect x="330.0" y="732.0" width="460.0" height="44.0" rx="22" fill="#e6e1f2" stroke="#9b8cc4" stroke-width="1.1"/>
<text x="560.0" y="754.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#2b2b28" text-anchor="middle" font-weight="normal" dominant-baseline="central">Adjust stock levels</text>
<rect x="330.0" y="784.0" width="460.0" height="44.0" rx="22" fill="#e6e1f2" stroke="#9b8cc4" stroke-width="1.1"/>
<text x="560.0" y="806.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#2b2b28" text-anchor="middle" font-weight="normal" dominant-baseline="central">View all orders and update status</text>
<text x="40.0" y="872.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f6e68" text-anchor="start" font-weight="normal" dominant-baseline="central">A Customer inherits every Guest use case, so those three are not repeated. Administrators do not shop through the system.</text>
</svg>