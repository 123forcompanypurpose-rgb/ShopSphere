<rect x="330.0" y="110.0" width="460.0" height="44.0" rx="22" fill="#f2f0e9" stroke="#b5b3aa" stroke-width="1.1"/>
<text x="560.0" y="132.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#2b2b28" text-anchor="middle" font-weight="normal" dominant-baseline="central">Browse and search the catalogue</text>
<rect x="330.0" y="162.0" width="460.0" height="44.0" rx="22" fill="#f2f0e9" stroke="#b5b3aa" stroke-width="1.1"/>
<text x="560.0" y="184.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#2b2b28" text-anchor="middle" font-weight="normal" dominant-baseline="central">View product details and reviews</text>
<rect x="330.0" y="214.0" width="460.0" height="44.0" rx="22" fill="#f2f0e9" stroke="#b5b3aa" stroke-width="1.1"/>
