<text x="125.0" y="754.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#2b2b28" text-anchor="middle" font-weight="600" dominant-baseline="central">Administrator</text>
