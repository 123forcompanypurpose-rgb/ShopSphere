<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 900 1000" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
<title>ShopSphere end to end data flow</title>
<desc>A user click travels through the React component, the Axios interceptor, the gateway, controller, service and repository layers into MySQL, and the response returns along the same path.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M1 1L9 5L1 9" fill="none" stroke="#8a8880" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/>
</marker>
<marker id="openarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M1 1L9 5L1 9" fill="none" stroke="#8a8880" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/>
</marker>
<marker id="tri" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
  <path d="M1.5 1.5L14.5 8L1.5 14.5Z" fill="#ffffff" stroke="#8a8880" stroke-width="1.3" stroke-linejoin="round" stroke-dasharray="none"/>
</marker>
<marker id="diamond" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="12" markerHeight="10" orient="auto-start-reverse">
  <path d="M1 5L7 1L13 5L7 9Z" fill="#ffffff" stroke="#8a8880" stroke-width="1.3" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="900" height="1000" fill="#ffffff"/>
<text x="40.0" y="36.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#2b2b28" text-anchor="start" font-weight="700" dominant-baseline="central">ShopSphere — End-to-End Data Flow</text>
<text x="40.0" y="57.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#6f6e68" text-anchor="start" font-weight="normal" dominant-baseline="central">One request: the user clicks Place Order. Same path for every operation in the system.</text>
<rect x="180.0" y="104.0" width="440.0" height="64.0" rx="8" fill="#fbe6dc" stroke="#d99a7c" stroke-width="1.1"/>
<text x="400.0" y="128.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b28" text-anchor="middle" font-weight="600" dominant-baseline="central">User clicks Place Order</text>
<text x="400.0" y="148.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f6e68" text-anchor="middle" font-weight="normal" dominant-baseline="central">Browser event inside CheckoutPage</text>
<text x="168.0" y="136.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#6f6e68" text-anchor="end" font-weight="700" dominant-baseline="central">1</text>
<line x1="400.0" y1="168.0" x2="400.0" y2="194.0" stroke="#8a8880" stroke-width="1.3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="180.0" y="194.0" width="440.0" height="64.0" rx="8" fill="#fbe6dc" stroke="#d99a7c" stroke-width="1.1"/>
<text x="400.0" y="218.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b28" text-anchor="middle" font-weight="600" dominant-baseline="central">React component</text>
<text x="400.0" y="238.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f6e68" text-anchor="middle" font-weight="normal" dominant-baseline="central">orderApi.create(addressId, paymentMethod)</text>
<text x="168.0" y="226.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#6f6e68" text-anchor="end" font-weight="700" dominant-baseline="central">2</text>
<line x1="400.0" y1="258.0" x2="400.0" y2="284.0" stroke="#8a8880" stroke-width="1.3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="180.0" y="284.0" width="440.0" height="64.0" rx="8" fill="#fbe6dc" stroke="#d99a7c" stroke-width="1.1"/>
<text x="400.0" y="308.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b28" text-anchor="middle" font-weight="600" dominant-baseline="central">Axios interceptor</text>
<text x="400.0" y="328.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f6e68" text-anchor="middle" font-weight="normal" dominant-baseline="central">Attaches Authorization: Bearer &lt;jwt&gt;</text>
<text x="168.0" y="316.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#6f6e68" text-anchor="end" font-weight="700" dominant-baseline="central">3</text>
<line x1="400.0" y1="348.0" x2="400.0" y2="374.0" stroke="#8a8880" stroke-width="1.3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="180.0" y="374.0" width="440.0" height="64.0" rx="8" fill="#e6e1f2" stroke="#9b8cc4" stroke-width="1.1"/>
<text x="400.0" y="398.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b28" text-anchor="middle" font-weight="600" dominant-baseline="central">API Gateway  ·  port 8080</text>
<text x="400.0" y="418.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f6e68" text-anchor="middle" font-weight="normal" dominant-baseline="central">Validates JWT, injects X-User-Id header</text>
<text x="168.0" y="406.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#6f6e68" text-anchor="end" font-weight="700" dominant-baseline="central">4</text>
<line x1="400.0" y1="438.0" x2="400.0" y2="464.0" stroke="#8a8880" stroke-width="1.3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="180.0" y="464.0" width="440.0" height="64.0" rx="8" fill="#dcece8" stroke="#6fa89e" stroke-width="1.1"/>
<text x="400.0" y="488.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b28" text-anchor="middle" font-weight="600" dominant-baseline="central">OrderController</text>
<text x="400.0" y="508.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f6e68" text-anchor="middle" font-weight="normal" dominant-baseline="central">@Valid rejects invalid input with HTTP 400</text>
<text x="168.0" y="496.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#6f6e68" text-anchor="end" font-weight="700" dominant-baseline="central">5</text>
<line x1="400.0" y1="528.0" x2="400.0" y2="554.0" stroke="#8a8880" stroke-width="1.3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="180.0" y="554.0" width="440.0" height="64.0" rx="8" fill="#dcece8" stroke="#6fa89e" stroke-width="1.1"/>
<text x="400.0" y="578.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b28" text-anchor="middle" font-weight="600" dominant-baseline="central">OrderServiceImpl</text>
<text x="400.0" y="598.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f6e68" text-anchor="middle" font-weight="normal" dominant-baseline="central">Feign calls Cart, Product and Payment services</text>
<text x="168.0" y="586.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#6f6e68" text-anchor="end" font-weight="700" dominant-baseline="central">6</text>
<line x1="400.0" y1="618.0" x2="400.0" y2="644.0" stroke="#8a8880" stroke-width="1.3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="180.0" y="644.0" width="440.0" height="64.0" rx="8" fill="#dcece8" stroke="#6fa89e" stroke-width="1.1"/>
<text x="400.0" y="668.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b28" text-anchor="middle" font-weight="600" dominant-baseline="central">OrderRepository</text>
<text x="400.0" y="688.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f6e68" text-anchor="middle" font-weight="normal" dominant-baseline="central">Spring Data JPA — Hibernate generates the SQL</text>
<text x="168.0" y="676.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#6f6e68" text-anchor="end" font-weight="700" dominant-baseline="central">7</text>
<line x1="400.0" y1="708.0" x2="400.0" y2="734.0" stroke="#8a8880" stroke-width="1.3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="180.0" y="734.0" width="440.0" height="64.0" rx="8" fill="#f2f0e9" stroke="#b5b3aa" stroke-width="1.1"/>
<text x="400.0" y="758.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b28" text-anchor="middle" font-weight="600" dominant-baseline="central">MySQL  ·  shopsphere_order</text>
<text x="400.0" y="778.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f6e68" text-anchor="middle" font-weight="normal" dominant-baseline="central">Rows written to orders and order_items</text>
<text x="168.0" y="766.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#6f6e68" text-anchor="end" font-weight="700" dominant-baseline="central">8</text>
<line x1="622.0" y1="406.0" x2="660.0" y2="406.0" stroke="#8a8880" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 3"/>
<rect x="662.0" y="385.0" width="198.0" height="42.0" rx="8" fill="#ffffff" stroke="#b5b3aa" stroke-width="1"/>
<text x="761.0" y="400.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#2b2b28" text-anchor="middle" font-weight="600" dominant-baseline="central">Eureka lookup</text>
<text x="761.0" y="417.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" fill="#6f6e68" text-anchor="middle" font-weight="normal" dominant-baseline="central">resolves ORDER-SERVICE</text>
<line x1="622.0" y1="586.0" x2="660.0" y2="586.0" stroke="#8a8880" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 3"/>
<rect x="662.0" y="565.0" width="198.0" height="42.0" rx="8" fill="#ffffff" stroke="#b5b3aa" stroke-width="1"/>
<text x="761.0" y="580.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#2b2b28" text-anchor="middle" font-weight="600" dominant-baseline="central">AOP aspect fires</text>
<text x="761.0" y="597.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" fill="#6f6e68" text-anchor="middle" font-weight="normal" dominant-baseline="central">SLF4J writes to logs/</text>
<path d="M120 778 V128" fill="none" stroke="#8a8880" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="106.0" y="451.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f6e68" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 106.0 451.0)">HTTP 201 Created — order JSON travels back up the same path</text>
<text x="40.0" y="838.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#2b2b28" text-anchor="start" font-weight="700" dominant-baseline="central">What this diagram is showing</text>
<text x="40.0" y="860.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f6e68" text-anchor="start" font-weight="normal" dominant-baseline="central">•  The JWT is attached in exactly one place (step 3) and validated in exactly one place (step 4). No component does either job twice.</text>
<text x="40.0" y="879.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f6e68" text-anchor="start" font-weight="normal" dominant-baseline="central">•  The gateway exchanges the token for an X-User-Id header. Downstream services never parse a JWT, which is why /internal/** must be unroutable.</text>
<text x="40.0" y="898.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f6e68" text-anchor="start" font-weight="normal" dominant-baseline="central">•  Validation runs on the client for fast feedback and again at step 5 on the server, because the client can always be bypassed.</text>
<text x="40.0" y="917.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f6e68" text-anchor="start" font-weight="normal" dominant-baseline="central">•  The logging aspect fires without OrderServiceImpl knowing it exists — no log.info() calls sit inside business methods.</text>
<text x="40.0" y="936.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f6e68" text-anchor="start" font-weight="normal" dominant-baseline="central">•  Any exception thrown on the way down is caught by GlobalExceptionHandler and returned as a readable message, never a stack trace.</text>
</svg>